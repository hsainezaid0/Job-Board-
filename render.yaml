services:
  - type: web
    name: hireloop-jobboard
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    buildCommand: python -m compileall -q server.py seed.py
    startCommand: python server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/stats
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: JOBBOARD_ENV
        value: production
      - key: JOBBOARD_DB
        value: /var/data/hireloop.sqlite3
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: hireloop-data
      mountPath: /var/data
      sizeGB: 1

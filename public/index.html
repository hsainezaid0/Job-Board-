<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Offres d’emploi, stages et alternances avec la fourchette de salaire affichée sur chaque annonce.">
  <meta name="theme-color" content="#244c3e">
  <title>HireLoop — Offres d’emploi avec salaire affiché</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css?v=3">
  <script src="/i18n.js?v=3" defer></script>
  <script src="/js/main.js?v=3" type="module"></script>
</head>

<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="header">
    <div class="container header-inner">
      <button type="button" class="icon-btn menu-toggle" aria-label="Menu" aria-expanded="false" aria-controls="main-nav">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a href="#jobs" class="brand" aria-label="HireLoop, accueil"><span class="brand-mark" aria-hidden="true">h</span><span>hireloop</span></a>
      <nav id="main-nav" class="main-nav" aria-label="Navigation principale">
        <a href="#jobs" data-nav="jobs">Offres</a>
        <a href="#companies" data-nav="companies">Entreprises</a>
        <a href="#applications" data-nav="applications" hidden>Mes candidatures <span class="pill nav-badge-top" hidden></span></a>
      </nav>
      <div class="header-actions">
        <div class="auth-nav" id="auth-nav"></div>
        <div class="language-switch" role="group" aria-label="Langue / Language">
          <button type="button" data-language="fr" lang="fr" aria-label="Français" aria-pressed="true">FR</button>
          <button type="button" data-language="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <a class="brand" href="#jobs"><span class="brand-mark" aria-hidden="true">h</span><span>hireloop</span></a>
        <p>Un job board où chaque offre affiche son salaire.</p>
      </div>
      <nav aria-label="Liens du pied de page">
        <a href="#jobs">Offres</a><a href="#companies">Entreprises</a><a href="#register">Créer un compte</a><a href="#admin">Espace recruteur</a>
      </nav>
      <p class="footer-note">Projet étudiant · Les entreprises, les offres et les personnes sont fictives.</p>
    </div>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>

</html>
